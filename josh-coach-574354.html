<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Josh Viveros · Coach</title>
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#F3F4EF;--card:#fff;--ink:#14201A;--mute:#5A665F;--line:#D5DAD2;--g1:#0B3D27;--g2:#0B5D3B;--au:#E9B93A;--soft:#E8ECE5}
@media (prefers-color-scheme:dark){:root{--bg:#0F1512;--card:#18211C;--ink:#EDF2EC;--mute:#A3B0A7;--line:#2C3A32;--soft:#1F2B24}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px}
header{background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 10px,transparent 10px 20px),linear-gradient(120deg,var(--g1),var(--g2));color:#fff;border-bottom:3px solid var(--au);padding:12px 16px;display:flex;gap:12px;align-items:center}
header img{width:44px;border-radius:6px;background:#fff;padding:2px}header b{font-size:24px;text-transform:uppercase;letter-spacing:.02em;display:block}header small{color:var(--au);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px 40px}
h2{font-size:17px;text-transform:uppercase;letter-spacing:.04em;margin:20px 0 8px;padding-left:10px;border-left:5px solid var(--au)}
.card{background:var(--card);border-radius:14px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.top{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.top div{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-radius:12px;padding:10px 6px;text-align:center}.top b{display:block;font-size:22px;color:var(--au)}.top span{font-size:11px;opacity:.9}
.wk{display:grid;grid-template-columns:58px repeat(7,1fr);gap:4px;align-items:center;margin-bottom:4px}.wk>span{font-size:11px;color:var(--mute);font-weight:700}
.c{height:30px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--mute);background:var(--card)}
.c.f{background:var(--g2);color:#fff;border-color:var(--g2)}.c.p{background:var(--au);color:#1B1405;border-color:var(--au)}.c.m{background:repeating-linear-gradient(45deg,var(--soft) 0 4px,transparent 4px 8px);border-style:dashed}.c.o{opacity:.45}.c.t{box-shadow:0 0 0 2.5px var(--ink)}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:6px}.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1.5px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}th{font-size:11px;text-transform:uppercase;color:var(--mute);letter-spacing:.05em}td.r,th.r{text-align:right}
.up{color:#2E7D52;font-weight:800}.dn{color:#B03A2E;font-weight:800}
.msg{border-left:4px solid var(--au);padding:6px 10px;margin:6px 0;background:var(--soft);border-radius:8px}.msg small{color:var(--mute)}
.sub{color:var(--mute);font-size:13px}.err{background:#F6E9E7;color:#7A1F1F;padding:10px;border-radius:10px;margin-top:8px}
input,button{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:2px solid var(--line)}button{background:var(--g2);color:#fff;border-color:var(--g2);font-weight:700;cursor:pointer}
.det td:last-child{font-size:12.5px;color:var(--mute)}
</style></head><body>

 $('sub').textContent=ti<0?'Starts Mon, Nov 30.':(ti>=DAYS.length?'Plan finished.':'Day '+(ti+1)+' of '+DAYS.length+', week '+(Math.floor(ti/7)+1)+' of 15.')+(lastT?' Last activity '+lastT.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})+'.':'');
 $('top').innerHTML=[[cnt?Math.round(sum/cnt)+'%':'–','avg done'],[act+'/'+cnt,'training days logged'],[BW.length?BW[BW.length-1][1]+'':'–','lb latest'],[BW.length>1?(ch>=0?'+':'')+ch.toFixed(1):'–','lb since day 1']].map(x=>'<div><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join('');
 if(!BW.length)$('bw').innerHTML='<div class="sub">No weigh-ins yet. First one is Mon, Nov 30.</div>';else{
  const W=640,H=180,px=36,vs=BW.map(x=>x[1]),mn=Math.min(...vs)-2,mx=Math.max(...vs)+2,X=k=>px+(W-px-12)*(k/91),Y=v=>14+(H-40)*(1-(v-mn)/(mx-mn));let g='';
  for(let t=0;t<=2;t++){const v=mn+(mx-mn)*t/2;g+='<line x1="'+px+'" x2="'+(W-8)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text x="'+(px-5)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="11" fill="var(--mute)">'+v.toFixed(0)+'</text>'}
  const P=BW.map(x=>[X(x[0]),Y(x[1])]);g+='<polyline fill="none" stroke="var(--au)" stroke-width="3" points="'+P.map(p=>p.join(',')).join(' ')+'"/>'+P.map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="5" fill="var(--g2)" stroke="var(--au)" stroke-width="2"/>').join('');
  g+='<text x="'+px+'" y="'+(H-6)+'" font-size="11" fill="var(--mute)">Nov 30</text><text x="'+(W-8)+'" y="'+(H-6)+'" text-anchor="end" font-size="11" fill="var(--mute)">Mar 1</text>';
  $('bw').innerHTML='<svg viewBox="0 0 '+W+' '+H+'" width="100%">'+g+'</svg><table><tr><th>Monday</th><th class="r">Weight</th><th class="r">Change</th></tr>'+BW.slice().reverse().map((x,k,a)=>{const pr=a[k+1],c=pr?x[1]-pr[1]:null;return '<tr><td>'+lab(x[0])+'</td><td class="r">'+x[1].toFixed(1)+' lb</td><td class="r">'+(c==null?'':(c>=0?'+':'')+c.toFixed(1))+'</td></tr>'}).join('')+'</table>'}
 /* grid */
 let gh='';for(let w=0;w<15;w++){const a=DAYS[w*7];gh+='<div class="wk"><span>Wk '+(w+1)+'<br>'+a.m+' '+a.d+'</span>';
  for(let k=0;k<7;k++){const i=w*7+k,d=DAYS[i],r=M[i],p=r&&r.b?Math.round(100*r.a/r.b):0,off=d.k==='OFF DAY';let c='';
   if(off)c='o';else if(i<=ti)c=p>=100?'f':p>0?'p':(i<ti?'m':'');gh+='<div class="c '+c+(i===ti?' t':'')+'" title="'+esc(lab(i))+(off?' off':' '+p+'%')+'">'+(off?'off':d.n.slice(0,2))+'</div>'}gh+='</div>'}
 $('grid').innerHTML=gh;
 /* lift weights: first and latest per lift */
 const L={};Object.keys(M).map(Number).sort((a,b)=>a-b).forEach(i=>secs(M[i]).forEach(x=>{if(String(x[0]).indexOf('Weights: ')!==0)return;String(x[0]).slice(9).split(', ').forEach(t=>{const m=/^(.*?) (\S+)$/.exec(t);if(!m)return;const n=m[1];(L[n]=L[n]||{f:null,l:null});if(!L[n].f)L[n].f=[i,m[2]];L[n].l=[i,m[2]]})}));
 const ks=Object.keys(L).sort((a,b)=>L[b].l[0]-L[a].l[0]);
 $('lw').innerHTML=ks.length?'<table><tr><th>Lift</th><th class="r">First</th><th class="r">Latest</th><th class="r">Change</th></tr>'+ks.map(n=>{const f=parseFloat(L[n].f[1]),l=parseFloat(L[n].l[1]),c=(!isNaN(f)&&!isNaN(l))?l-f:null;return '<tr><td>'+esc(n)+'<br><small class="sub">'+lab(L[n].l[0])+'</small></td><td class="r">'+esc(L[n].f[1])+'</td><td class="r">'+esc(L[n].l[1])+'</td><td class="r '+(c>0?'up':c<0?'dn':'')+'">'+(c==null||c===0?'':(c>0?'+':'')+c)+'</td></tr>'}).join('')+'</table>':'<div class="sub">No lift weights logged yet.</div>';
 /* detail */
 let dt='';for(let i=Math.min(last,DAYS.length-1);i>=0;i--){const r=M[i];if(!r)continue;const s=secs(r).filter(x=>!/^(Weights|Weigh-in):/.test(x[0]));dt+='<tr><td><b>'+lab(i)+'</b></td><td>'+(r.b?Math.round(100*r.a/r.b):0)+'%</td><td>'+s.map(x=>esc(x[0])+(x[2]>1?' '+x[1]+'/'+x[2]:(x[1]?' ✓':' ✗'))).join(' · ')+'</td></tr>'}
 $('det').innerHTML=dt||'<tr><td class="sub">Nothing logged yet.</td></tr>';
 $('msgs').innerHTML=j.msgs.length?j.msgs.slice().reverse().map(m=>'<div class="msg"><small>'+lab(+m.d)+'</small><div>'+esc(m.m)+'</div></div>').join(''):'<div class="sub">No messages yet.</div>'}
if(ls('josh-coach-pw')){load()}
</script></body></html>
